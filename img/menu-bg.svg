<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice">
  <!-- Start-menu background: paper airplanes gliding through a sunset sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fbf"/>
      <stop offset=".45" stop-color="#7fbbe8"/>
      <stop offset=".78" stop-color="#cfe6f2"/>
      <stop offset="1" stop-color="#fbdcb4"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".45" stop-color="#ffe7a8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd58a" stop-opacity="0"/>
    </radialGradient>
    <g id="cloud">
      <circle cx="0" cy="0" r="46"/><circle cx="52" cy="-18" r="58"/><circle cx="112" cy="-4" r="48"/>
      <circle cx="160" cy="10" r="34"/><rect x="-30" y="0" width="210" height="44" rx="22"/>
    </g>
    <!-- a classic dart seen from the side, nose pointing right -->
    <g id="plane" stroke="#22356b" stroke-width="3.5" stroke-linejoin="round">
      <path d="M110 0 L-62 -34 L-28 2 Z" fill="#ffffff"/>
      <path d="M110 0 L-28 2 L-52 28 Z" fill="#dfe5ee"/>
      <path d="M110 0 L-28 2 L-14 16 Z" fill="#c3ccda"/>
      <path d="M110 0 L-40 -16" fill="none" stroke-width="2" opacity=".55"/>
    </g>
    <g id="planeRed" stroke="#5e1610" stroke-width="3.5" stroke-linejoin="round">
      <path d="M110 0 L-62 -34 L-28 2 Z" fill="#e2493b"/>
      <path d="M110 0 L-28 2 L-52 28 Z" fill="#c4372b"/>
      <path d="M110 0 L-28 2 L-14 16 Z" fill="#a82c22"/>
    </g>
    <g id="planeBlue" stroke="#1d3f80" stroke-width="3.5" stroke-linejoin="round">
      <path d="M110 0 L-62 -34 L-28 2 Z" fill="#cfe3fa"/>
      <path d="M110 0 L-28 2 L-52 28 Z" fill="#a9c8ee"/>
      <path d="M110 0 L-28 2 L-14 16 Z" fill="#86acdc"/>
      <path d="M-50 -20 L90 -3 M-38 -10 L96 -1" fill="none" stroke="#7fa6d8" stroke-width="1.5"/>
    </g>
    <g id="planeGold" stroke="#7a5508" stroke-width="3.5" stroke-linejoin="round">
      <path d="M110 0 L-62 -34 L-28 2 Z" fill="#f6d66e"/>
      <path d="M110 0 L-28 2 L-52 28 Z" fill="#dbb03a"/>
      <path d="M110 0 L-28 2 L-14 16 Z" fill="#c49520"/>
    </g>
  </defs>

  <rect width="900" height="1600" fill="url(#sky)"/>
  <circle cx="660" cy="1250" r="260" fill="url(#sun)"/>

  <!-- far clouds -->
  <g fill="#ffffff" opacity=".45">
    <use xlink:href="#cloud" transform="translate(40 300) scale(.8)"/>
    <use xlink:href="#cloud" transform="translate(620 180) scale(.6)"/>
    <use xlink:href="#cloud" transform="translate(520 760) scale(.7)"/>
    <use xlink:href="#cloud" transform="translate(-40 980) scale(.9)"/>
  </g>
  <!-- distant planes -->
  <g opacity=".55">
    <use xlink:href="#plane" transform="translate(760 420) rotate(18) scale(.28)"/>
    <use xlink:href="#planeBlue" transform="translate(140 640) rotate(-12) scale(.24) scale(-1 1)"/>
    <use xlink:href="#plane" transform="translate(420 140) rotate(28) scale(.22)"/>
  </g>
  <!-- near clouds -->
  <g fill="#ffffff" opacity=".85">
    <use xlink:href="#cloud" transform="translate(600 1080) scale(1.1)"/>
    <use xlink:href="#cloud" transform="translate(-60 1320) scale(1.3)"/>
    <use xlink:href="#cloud" transform="translate(380 1480) scale(1.2)"/>
  </g>
  <!-- the main planes, kept in the open sky above the title and below the menu buttons -->
  <use xlink:href="#planeRed" transform="translate(230 170) rotate(16) scale(.6)"/>
  <use xlink:href="#planeGold" transform="translate(700 300) rotate(-14) scale(.42) scale(-1 1)"/>
  <use xlink:href="#plane" transform="translate(560 1420) rotate(-16) scale(1.05)"/>
  <use xlink:href="#planeBlue" transform="translate(190 1395) rotate(10) scale(.5)"/>

  <!-- rolling hills far below -->
  <path d="M0 1500 Q150 1440 300 1490 T600 1480 T900 1470 V1600 H0 Z" fill="#9cc79a" opacity=".75"/>
  <path d="M0 1545 Q200 1500 420 1550 T900 1530 V1600 H0 Z" fill="#7fb07d"/>
</svg>
