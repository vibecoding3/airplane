<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Nosedive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="wrap">
    <div id="world">
      <div class="page-colour" id="pageNow"></div>
      <div class="page-colour" id="pageNext"></div>
      <div id="ruling"></div>
      <canvas id="game" aria-label="Paper Nosedive playfield"></canvas>
    </div>
    <!-- bump on every change that gets pushed, to confirm GitHub Pages is serving the latest build -->
    <div class="version" id="version">v96</div>

    <div class="hud">
      <div>
        <div class="label">Depth</div>
        <div class="depth"><span id="depth">0</span> <small>m</small></div>
      </div>
      <div class="right">
        <div class="tools">
          <div class="hint" id="hint" aria-live="polite" hidden></div>
          <button id="muteBtn" class="icon-btn" type="button" aria-label="Sound on"></button>
          <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pause"></button>
        </div>
        <div><span id="starCount">★ 0</span> · best <span id="best">0</span> m</div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="menu" id="titleCard">
        <h1 class="menu-title">Paper<br>Nosedive</h1>
        <p class="menu-tag">How deep can your paper plane fall?</p>
        <div class="menu-stats"><span>Best <b id="menuBest">0</b> m</span><span>★ <b id="menuBank">0</b></span></div>
        <div class="xp" id="titleXp"></div>
        <div class="map-pick" role="group" aria-label="Choose a map">
          <button class="map-tile" type="button" data-map="notebook" aria-pressed="true"><span class="map-thumb paper"></span>Paper</button>
          <button class="map-tile" type="button" data-map="sea" aria-pressed="false"><span class="map-thumb sea"></span>Ocean</button>
          <button class="map-tile" type="button" data-map="space" aria-pressed="false"><span class="map-thumb space"></span>Space</button>
          <button class="map-tile" type="button" data-map="dungeon" aria-pressed="false"><span class="map-thumb dungeon"></span>Dungeon</button>
        </div>
        <button class="menu-btn primary" id="startBtn" type="button">Play</button>
        <button class="menu-btn coll-open" id="collBtn" type="button">Collections</button>
      </div>


      <div class="menu" id="collCard" hidden>
        <h2 class="menu-title small">Collections</h2>
        <p class="menu-tag">Find these in your runs to unlock them.</p>
        <p class="menu-tag coll-rule">Collectibles are obstacles that only appear once per run.</p>
        <div class="coll-sets" id="collSets"></div>
        <button class="menu-btn" id="collBack" type="button">Back</button>
      </div>

      <div class="menu" id="pauseCard" hidden>
        <h2 class="menu-title small">Paused</h2>
        <p class="menu-tag">Your plane is hanging in mid-air.</p>
        <button class="menu-btn primary" id="resumeBtn" type="button">Resume</button>
        <button class="menu-btn" id="exitBtn" type="button">Exit run</button>
      </div>

      <div class="menu" id="overCard" role="group" aria-label="Run over" hidden>
        <div class="menu-score" id="overTitle">0 m</div>
        <span class="menu-record" id="recordStamp" hidden>New best!</span>
        <div class="menu-stats"><span id="overBest">Best 0 m</span></div>
        <p class="menu-note" id="overBank"></p>
        <div class="xp" id="overXp"></div>
        <span class="menu-record" id="levelStamp" hidden>Level up!</span>
        <div class="map-pick" role="group" aria-label="Choose a map for the next run">
          <button class="map-tile" type="button" data-map="notebook" aria-pressed="true"><span class="map-thumb paper"></span>Paper</button>
          <button class="map-tile" type="button" data-map="sea" aria-pressed="false"><span class="map-thumb sea"></span>Ocean</button>
          <button class="map-tile" type="button" data-map="space" aria-pressed="false"><span class="map-thumb space"></span>Space</button>
          <button class="map-tile" type="button" data-map="dungeon" aria-pressed="false"><span class="map-thumb dungeon"></span>Dungeon</button>
        </div>
        <button class="menu-btn primary" id="againBtn" type="button">Play again</button>
        <button class="menu-btn coll-open" id="overCollBtn" type="button">Collections</button>
      </div>
    </div>
  </div>
</div>
<!-- the scripts share one global scope and run in this order: main.js must stay last -->
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/paper-background.js"></script>
<script src="js/sea-background.js"></script>
<script src="js/space-background.js"></script>
<script src="js/dungeon-background.js"></script>
<script src="js/state.js"></script>
<script src="js/obstacles.js"></script>
<script src="js/physics.js"></script>
<script src="js/maps.js"></script>
<script src="js/draw-paper.js"></script>
<script src="js/draw-sea.js"></script>
<script src="js/draw-space.js"></script>
<script src="js/draw-dungeon.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/collections.js"></script>
<script src="js/main.js"></script>
</body>
</html>
